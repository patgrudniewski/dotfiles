# Plugin manager
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'

# Powerline theme (solarized dark accent)
set -g @plugin 'wfxr/tmux-power'
set -g @tmux_power_theme 'snow'
set -g @tmux_power_left_a '#{USER}'
set -g @tmux_power_left_b ''
set -g @tmux_power_right_y '%T'
set -g @tmux_power_right_z '%F'
set -g @tmux_power_g3 "#ff0000"

# Options
set-option -g status-interval 1
set-option -g allow-rename off

# Initialize TPM (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
