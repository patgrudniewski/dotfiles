# Plugin manager
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'

# Powerline theme (solarized dark accent)
set -g @plugin 'wfxr/tmux-power'
set -g @tmux_power_theme '#b58900'
set -g @tmux_power_g0 "#002b36"
set -g @tmux_power_g1 "#073642"
set -g @tmux_power_g2 "#586e75"
set -g @tmux_power_g3 "#657b83"
set -g @tmux_power_g4 "#839496"
set -g @tmux_power_left_a '#{USER}@#h'
set -g @tmux_power_left_b '#S'
set -g @tmux_power_right_y '%T'
set -g @tmux_power_right_z '%F'

# Options
set-option -g status-interval 1
set-option -g allow-rename off

# Initialize TPM (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
